# 改 rpg/version.py 的版本号推到 main → 在 Windows 上打包 xingce-xiuxian.exe、在 Linux 上打包平板 App xingce-xiuxian.apk、
# 在 Mac 上打包 行测修仙传.app（Apple 芯片，xingce-xiuxian-mac.zip），
# 一起发到 Releases（tag v<版本>）
# 程序里「设置 → 🆕 版本与更新 → 检查更新」读的就是这里发的 Release
name: build-exe

on:
  push:
    branches: [main]
    paths: [rpg/version.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name xingce-xiuxian
          --icon web/icons/app.ico
          --add-data "web;web" --add-data "defaults;defaults" --add-data "rpg/data;rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf --collect-all webview
          app.py

      - name: Smoke test
        shell: pwsh
        run: |
          $out = & dist/xingce-xiuxian.exe --run-script tests/smoke_frozen.py | Out-String
          Write-Output $out
          if ($out -notmatch "SMOKE-OK") { throw "frozen smoke test failed" }

      - name: Relaunch test (一键更新换文件后能重新打开)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "relaunch"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist/xingce-xiuxian.exe "$d/app.exe"
          Copy-Item dist/xingce-xiuxian.exe "$d/app.new.exe"
          $log = Join-Path $HOME ".xingce-rpg/启动日志.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          & "$d/app.exe" --run-script tests/smoke_relaunch.py "$d/app.new.exe" "$d/app.exe" | Out-String | Write-Output
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and ((Get-Content $log -Raw -Encoding utf8) -match "已启动")) { $ok = $true; break }
          }
          if (Test-Path $log) { Get-Content $log -Encoding utf8 | Write-Output }
          Get-Process app -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "$d/app.new.exe") { throw "新 exe 没换上去" }
          if (-not $ok) { throw "换文件后重开的程序没起来" }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('rpg/version.py', encoding='utf-8').read()).group(1))")
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/xingce-xiuxian.exe --clobber
          else
            # 更新说明：取 rpg/data/changelog.md 里这一版的那一节（没有就用提交说明，去掉署名行）
            NOTES=$(PYTHONIOENCODING=utf-8 python -c "import sys; sys.path.insert(0, '.'); from rpg import changelog; e = changelog.entries(); print('\n'.join('- ' + x for x in e[0]['items']) if e and e[0]['version'] == '$V' else '')")
            [ -n "$NOTES" ] || NOTES=$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):')
            gh release create "v$V" dist/xingce-xiuxian.exe --title "行测修仙传 v$V" --notes "$NOTES"
          fi

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build apk
        run: bash android/build.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          gh release upload "v$V" android/build/xingce-xiuxian.apk --clobber

  mac:
    needs: build
    runs-on: macos-latest          # Apple 芯片（M / A 系列）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf pillow pyobjc-framework-Vision

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name XingceXiuxian
          --osx-bundle-identifier com.xingce.xiuxian
          --icon web/icons/icon-512.png
          --add-data "web:web" --add-data "defaults:defaults" --add-data "rpg/data:rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf
          --hidden-import Vision --hidden-import Foundation
          app.py

      - name: Name, version, sign, zip
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          APP="dist/行测修仙传.app"
          mv dist/XingceXiuxian.app "$APP"
          P="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 行测修仙传" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 行测修仙传" "$P" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 行测修仙传" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$P" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent "行测修仙传.app" ../xingce-xiuxian-mac.zip)
          ls -l xingce-xiuxian-mac.zip

      - name: Smoke test
        run: |
          out=$("dist/行测修仙传.app/Contents/MacOS/XingceXiuxian" --run-script tests/smoke_frozen.py)
          echo "$out"
          echo "$out" | grep -q SMOKE-OK

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          gh release upload "v$V" xingce-xiuxian-mac.zip --clobber
