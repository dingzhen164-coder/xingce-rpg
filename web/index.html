<!doctype html>
<!--
  行测修仙传 / 行测魔法学院 前端页面骨架。所有内容由 app.js 渲染到 #view 里；样式在 style.css。
  导航文字、标题、配色由 app.js 按当前风格（修仙 / 玄幻）替换。
  页面结构：背景层 + 语录层（ambience.js） + 顶栏（标志 / 导航 / 今日时长 / ♪ 背景音乐） + 主视图 + 右下角提示层 + 升级弹窗。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测修仙传</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body class="xiuxian">
<div id="bgLayer"></div>
<div id="quoteLayer"></div>
<header class="topbar">
  <div class="brand">☯ 行测修仙传</div>
  <nav id="nav">
    <a data-view="home" class="active">洞府</a>
    <a data-view="train">修炼</a>
    <a data-view="contest">宗门大比</a>
    <a data-view="skeleton">藏经阁</a>
    <a data-view="wrong">心魔录</a>
    <a data-view="pill">丹房</a>
    <a data-view="log">修仙录</a>
    <a data-view="settings">设置</a>
  </nav>
  <div class="today-pill" id="todayPill" title="今天的有效修炼时间（只有做功课时才计时）">🕯 今日修炼</div>
  <button class="bgm-btn" id="bgmBtn" title="背景音乐：关（点一下打开）">♪</button>
  <button class="bgm-btn draw-btn" id="drawBtn" title="草稿：定住页面写写画画（Esc 关闭）">✏</button>
</header>
<div id="banner"></div>
<main id="view"></main>
<div id="toasts"></div>
<div id="modal" class="modal hidden"></div>
<script src="ambience.js"></script>
<script src="settle.js"></script>
<script src="ceremony.js"></script>
<script src="app.js"></script>
<script src="contest.js"></script>
<script src="idioms.js"></script>
<script src="draw.js"></script>
</body>
</html>
